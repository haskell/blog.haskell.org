on:
  push:
    branches:
      - main
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    if: github.ref != 'refs/heads/main'
    steps:
      - name: 'Checkout'
        uses: actions/checkout@main
        with:
          submodules: "recursive"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: taiki-e/install-action@v2
        with:
          tool: zola@0.23.6

      - run: npm install
      - run: npm run abridge
      - name: 'Build only'
        uses: shalzz/zola-deploy-action@v0.23.6
        env:
          BUILD_DIR: .
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_ONLY: true

  build_and_deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: 'Checkout'
        uses: actions/checkout@main
        with:
          submodules: "recursive"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: taiki-e/install-action@v2
        with:
          tool: zola@0.23.6
      - run: npm install
      - run: npm run abridge
      - name: 'Build and deploy'
        uses: shalzz/zola-deploy-action@v0.23.6
        env:
          PAGES_BRANCH: gh-pages
          BUILD_DIR: .
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
